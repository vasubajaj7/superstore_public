name: Superstore Data Pipeline CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Databricks CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
    
    - name: Deploy to Dev
      run: |
        databricks bundle deploy --target dev
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    - name: Run Setup Infrastructure Job
      run: |
        JOB_ID=$(databricks jobs list --output json | jq -r '.[] | select(.settings.name | contains("Setup Infrastructure")) | .job_id')
        if [ -n "$JOB_ID" ]; then
          databricks jobs run-now $JOB_ID
        fi
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    - name: Run Data Ingestion Job
      run: |
        JOB_ID=$(databricks jobs list --output json | jq -r '.[] | select(.settings.name | contains("Superstore Data Ingestion")) | .job_id')
        if [ -n "$JOB_ID" ]; then
          databricks jobs run-now $JOB_ID
        fi
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-prod:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Databricks CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
    
    - name: Deploy to Production
      run: |
        databricks bundle deploy --target prod
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    - name: Run Setup Infrastructure Job
      run: |
        JOB_ID=$(databricks jobs list --output json | jq -r '.[] | select(.settings.name | contains("Setup Infrastructure")) | .job_id')
        if [ -n "$JOB_ID" ]; then
          databricks jobs run-now $JOB_ID
        fi
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    
    - name: Run Data Ingestion Job
      run: |
        JOB_ID=$(databricks jobs list --output json | jq -r '.[] | select(.settings.name | contains("Superstore Data Ingestion")) | .job_id')
        if [ -n "$JOB_ID" ]; then
          databricks jobs run-now $JOB_ID
        fi
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}