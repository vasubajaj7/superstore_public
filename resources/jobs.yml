resources:
  jobs:
    setup_infrastructure:
      name: "Setup Infrastructure"
      tasks:
        - task_key: "setup_catalog"
          notebook_task:
            notebook_path: "src/setup_catalog.py"
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_stage: ${var.schema_stage}
              schema_processed: ${var.schema_processed}
              volume_name: ${var.volume_name}
    
    superstore_ingestion:
      name: "Superstore Data Ingestion"
      tasks:
        - task_key: "load_raw_to_stage"
          notebook_task:
            notebook_path: "src/load_raw_to_stage.py"
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_stage}
              volume_name: ${var.volume_name}