bundle:
  name: superstore

include:
  - resources/*.yml

variables:
  catalog_name:
    default: superstore
  schema_stage:
    default: stage
  schema_processed:
    default: processed
  volume_name:
    default: raw

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog_name: ${var.catalog_name}_dev
  
  prod:
    mode: production
    variables:
      catalog_name: ${var.catalog_name}